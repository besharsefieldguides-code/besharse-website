<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Besharse Field Guides</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fixed Navbar -->
    <nav class="navbar">
        <span class="nav-brand">Besharse Field Guides</span>
        
        <div class="nav-links">
            <a href="#home" class="nav-link">Home</a>
            <a href="#about" class="nav-link">About</a>
            <a href="#photos" class="nav-link">Photos</a>
            <a href="#field-guides" class="nav-link">Field Guides</a>
            <a href="#news" class="nav-link">News</a>
            <a href="#contact" class="nav-link">Contact</a>
            <a href="#donate" class="nav-link nav-donate">
                <span class="donate-icon">
                    <span class="icon-heart">❤</span>
                </span>
                Donate
            </a>
        </div>
    </nav>

    <!-- Fullscreen Hero Section -->
    <div id="home" class="hero-canvas">
        <div class="hero-content">
            <h1 class="hero-title">Besharse Field Guides</h1>
            <p class="hero-subtitle">Comprehensive wildlife field guides dedicated to conservation, education, and rescue.</p>
        </div>
    </div>

    <!-- Stats Section (White Background, Text & Icons Swapped) -->
    <section class="stats-section">
        <div class="stats-container">
            <!-- Box 1: Wildlife Rescued -->
            <div class="stat-card">
                <h3 class="stat-number">1,240+</h3>
                <p class="stat-label">Wildlife Rescued</p>
                <div class="stat-icon-container">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>

            <!-- Box 2: Field Guides Sold -->
            <div class="stat-card">
                <h3 class="stat-number">850+</h3>
                <p class="stat-label">Field Guides Sold</p>
                <div class="stat-icon-container">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 11.55C11.2 10.3 9.42 9 7.5 9c-1.88 0-3.81 1.05-4.5 2.45v8.1c.72-.75 2.25-1.55 4.5-1.55 1.92 0 3.7 1.3 4.5 2.55.8-1.25 2.58-2.55 4.5-2.55 2.25 0 3.78.8 4.5 1.55v-8.1c-.69-1.4-2.62-2.45-4.5-2.45-1.92 0-3.7 1.3-4.5 2.55M12 5c.74-1.2 2.37-2 4.5-2 2.38 0 4.88 1.21 5.5 3v11c-.75-.6-2.38-1-5.5-1-2 0-3.86 1.02-4.5 2.14C11.36 17.02 9.5 16 7.5 16c-3.12 0-4.75.4-5.5 1V6c.62-1.79 3.12-3 5.5-3 2.13 0 3.76.8 4.5 2z"/>
                    </svg>
                </div>
            </div>

            <!-- Box 3: Reviews -->
            <div class="stat-card">
                <h3 class="stat-number">500+</h3>
                <p class="stat-label">Reviews</p>
                <div class="stat-icon-container">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                </div>
            </div>

            <!-- Box 4: Days in Business -->
            <div class="stat-card">
                <h3 class="stat-number">3,650</h3>
                <p class="stat-label">Days in Business</p>
                <div class="stat-icon-container">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Bottom Spacer -->
    <div class="bottom-spacer"></div>

</body>
</html>
