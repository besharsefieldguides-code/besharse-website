<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Besharse Field Guides — Wildlife Field Guides & Conservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabin:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --black:#0a0c0a;
  --near-black:#111410;
  --dark:#1a1f18;
  --mud:#2a2e26;
  --olive:#3d4a32;
  --moss:#5a7048;
  --fern:#7a9458;
  --lime-accent:#a8c848;
  --orange:#d4621a;
  --orange-bright:#f07020;
  --cream:#f0ead8;
  --off-white:#faf6ee;
  --text-on-dark:rgba(240,234,216,0.92);
  --text-muted:rgba(240,234,216,0.55);
  --border-dark:rgba(240,234,216,0.12);
  --border-light:rgba(240,234,216,0.25);
}
html{scroll-behavior:smooth;}
body{font-family:'Cabin',sans-serif;background:var(--black);color:var(--cream);overflow-x:hidden;}
#root{min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--olive);}

/* ── UTILITIES ── */
.container{max-width:1200px;margin:0 auto;padding:0 2rem;}
.label{font-family:'Courier Prime',monospace;font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--lime-accent);}
.big-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,8vw,8rem);line-height:0.92;letter-spacing:0.02em;color:var(--cream);}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.5rem,6vw,5.5rem);line-height:0.95;color:var(--cream);}
.divider{width:48px;height:3px;background:var(--orange);margin:1.2rem 0;}
.btn{display:inline-block;font-family:'Courier Prime',monospace;font-size:0.75rem;letter-spacing:0.14em;text-transform:uppercase;padding:0.85rem 2rem;border-radius:2px;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:hover{background:var(--orange-bright);}
.btn-ghost{background:transparent;border:1px solid var(--border-light);color:var(--cream);}
.btn-ghost:hover{background:rgba(240,234,216,0.08);}
.btn-lime{background:var(--lime-accent);color:var(--black);}
.btn-lime:hover{background:#c0e050;}
.btn-sm{padding:0.55rem 1.2rem;font-size:0.67rem;}
.btn-full{width:100%;text-align:center;}
.tag{display:inline-block;font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 0.7rem;background:rgba(168,200,72,0.15);border:1px solid rgba(168,200,72,0.3);color:var(--lime-accent);border-radius:2px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--fern);color:#fff;padding:0.8rem 1.5rem;border-radius:2px;font-family:'Courier Prime',monospace;font-size:0.78rem;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--near-black);border:1px solid var(--border-dark);border-radius:4px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;padding:2.5rem;position:relative;}
.modal-x{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer;font-family:'Courier Prime',monospace;transition:color 0.2s;}
.modal-x:hover{color:var(--cream);}
.modal h2{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--cream);margin:0.5rem 0 1.5rem;}

/* ── FORMS ── */
label{display:block;font-family:'Courier Prime',monospace;font-size:0.67rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);margin-top:1.1rem;}
label:first-of-type{margin-top:0;}
input,textarea,select{width:100%;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.05);border:1px solid var(--border-dark);border-radius:2px;color:var(--cream);font-family:'Cabin',sans-serif;font-size:0.95rem;outline:none;margin-top:0.3rem;transition:border-color 0.2s;}
input:focus,textarea:focus,select:focus{border-color:var(--lime-accent);}
select option{background:var(--dark);}
.form-error{background:rgba(212,98,26,0.15);border:1px solid rgba(212,98,26,0.4);border-radius:2px;padding:0.65rem 0.9rem;font-size:0.85rem;color:#f09060;margin-bottom:1rem;}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:0 2rem;height:68px;display:flex;align-items:center;justify-content:space-between;transition:background 0.4s,border-bottom 0.4s;}
nav.scrolled{background:rgba(10,12,10,0.96);border-bottom:1px solid var(--border-dark);}
.nav-logo-text{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:0.06em;color:var(--cream);text-decoration:none;}
.nav-logo-sub{font-family:'Courier Prime',monospace;font-size:0.52rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--lime-accent);}
.nav-links{display:flex;align-items:center;gap:2rem;list-style:none;}
.nav-links a{font-family:'Courier Prime',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-on-dark);text-decoration:none;transition:color 0.2s;}
.nav-links a:hover{color:var(--lime-accent);}
.nav-right{display:flex;align-items:center;gap:0.75rem;}
@media(max-width:900px){.nav-links{display:none;}}

/* ── HERO ── */
.hero{position:relative;height:100vh;min-height:640px;display:flex;align-items:flex-end;overflow:hidden;}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center;background-attachment:fixed;}
.hero-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.4) 45%,rgba(0,0,0,0.15) 100%);}
.hero-content{position:relative;z-index:2;padding:0 2rem 5rem;max-width:1200px;margin:0 auto;width:100%;}
.hero-eyebrow{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;}
.hero-dot{width:8px;height:8px;background:var(--orange);border-radius:50%;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(0.8);}}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,10vw,9.5rem);line-height:0.88;color:var(--cream);margin-bottom:1.5rem;text-shadow:0 4px 40px rgba(0,0,0,0.5);}
.hero-title span{color:var(--orange);}
.hero-sub{font-size:1.05rem;color:rgba(240,234,216,0.75);line-height:1.7;max-width:520px;margin-bottom:2.5rem;}
.hero-ctas{display:flex;gap:1rem;flex-wrap:wrap;}
.hero-scroll-hint{position:absolute;bottom:2rem;right:2rem;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;}
.scroll-line{width:1px;height:48px;background:linear-gradient(to bottom,rgba(240,234,216,0.5),transparent);animation:scrollLine 2s ease-in-out infinite;}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top;}50%{transform:scaleY(1);transform-origin:top;}51%{transform:scaleY(1);transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}

/* ── PHOTO STRIP ── */
.photo-strip{display:grid;grid-template-columns:repeat(5,1fr);height:220px;gap:3px;}
.photo-strip-item{position:relative;overflow:hidden;cursor:pointer;}
.photo-strip-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s;}
.photo-strip-item:hover img{transform:scale(1.08);}
.photo-strip-item::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.25);transition:background 0.3s;}
.photo-strip-item:hover::after{background:rgba(0,0,0,0.1);}
.photo-strip-caption{position:absolute;bottom:0;left:0;right:0;padding:0.5rem 0.65rem;background:linear-gradient(transparent,rgba(0,0,0,0.8));font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(240,234,216,0.8);z-index:2;}

/* ── BOOKS ── */
.books-section{background:var(--near-black);padding:7rem 0;}
.books-intro{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:end;margin-bottom:4rem;}
@media(max-width:768px){.books-intro{grid-template-columns:1fr;gap:1.5rem;}}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;}
.book-card{position:relative;overflow:hidden;cursor:pointer;group:true;}
.book-img-wrap{height:360px;position:relative;overflow:hidden;}
.book-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s;}
.book-card:hover .book-img-wrap img{transform:scale(1.06);}
.book-img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.1) 60%);}
.book-badge{position:absolute;top:1rem;left:1rem;z-index:3;}
.book-over{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:1.5rem;}
.book-vol{font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--lime-accent);margin-bottom:0.4rem;}
.book-name{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--cream);line-height:1;margin-bottom:0.25rem;}
.book-sub{font-size:0.8rem;color:rgba(240,234,216,0.65);margin-bottom:0.75rem;}
.book-price-row{display:flex;align-items:center;justify-content:space-between;}
.book-price{font-family:'Courier Prime',monospace;font-size:1rem;font-weight:700;color:var(--orange-bright);}
.book-links-hover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0.75rem;background:rgba(10,12,10,0.88);opacity:0;transition:opacity 0.3s;padding:2rem;}
.book-card:hover .book-links-hover{opacity:1;}
.book-links-hover-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);text-align:center;margin-bottom:0.5rem;}
.book-links-row{display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;}
.buy-pill{font-family:'Courier Prime',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.45rem 1rem;border:1px solid var(--border-light);border-radius:2px;color:var(--cream);text-decoration:none;transition:all 0.2s;}
.buy-pill:hover{background:var(--orange);border-color:var(--orange);}
.draft-overlay{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;}
.draft-label{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--orange);border:2px solid var(--orange);padding:0.5rem 1.5rem;transform:rotate(-5deg);}

/* ── NEWS ── */
.news-section{padding:7rem 0;background:var(--dark);}
.news-featured{display:grid;grid-template-columns:1.4fr 1fr;gap:2px;margin-top:3rem;}
@media(max-width:768px){.news-featured{grid-template-columns:1fr;}}
.news-main{position:relative;height:480px;overflow:hidden;cursor:pointer;}
.news-main img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s;}
.news-main:hover img{transform:scale(1.04);}
.news-main::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.9),rgba(0,0,0,0.2));}
.news-main-content{position:absolute;bottom:0;left:0;right:0;padding:2rem;z-index:2;}
.news-stack{display:flex;flex-direction:column;gap:2px;}
.news-small{position:relative;height:156.67px;overflow:hidden;cursor:pointer;}
.news-small img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s;}
.news-small:hover img{transform:scale(1.05);}
.news-small::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.88),rgba(0,0,0,0.15));}
.news-small-content{position:absolute;bottom:0;left:0;right:0;padding:1rem;z-index:2;}
.news-title-text{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);line-height:1.05;margin:0.4rem 0 0.3rem;}
.news-small-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--cream);line-height:1.05;margin:0.3rem 0 0;}
.news-excerpt{font-size:0.85rem;color:rgba(240,234,216,0.7);line-height:1.6;margin-top:0.4rem;}
.news-date-text{font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.1em;color:rgba(240,234,216,0.5);margin-top:0.4rem;}
.news-more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px;margin-top:2px;}

/* ── ABOUT ── */
.about-section{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.about-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;background-attachment:fixed;}
.about-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(10,12,10,0.96) 0%,rgba(10,12,10,0.7) 55%,rgba(10,12,10,0.3) 100%);}
.about-content{position:relative;z-index:2;padding:7rem 2rem;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center;}
@media(max-width:768px){.about-content{grid-template-columns:1fr;gap:2.5rem;padding:5rem 1.5rem;}}
.about-text p{font-size:1rem;color:rgba(240,234,216,0.8);line-height:1.9;margin-bottom:1.1rem;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2.5rem;}
.stat-box{padding:1.25rem;border:1px solid var(--border-dark);border-radius:2px;background:rgba(255,255,255,0.03);}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;color:var(--orange-bright);line-height:1;}
.stat-desc{font-family:'Courier Prime',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-top:0.25rem;}
.about-img-col{display:flex;flex-direction:column;gap:3px;}
.about-img-tall{height:300px;overflow:hidden;border-radius:2px;}
.about-img-tall img{width:100%;height:100%;object-fit:cover;}
.about-img-pair{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.about-img-short{height:160px;overflow:hidden;border-radius:2px;}
.about-img-short img{width:100%;height:100%;object-fit:cover;}

/* ── REVIEWS ── */
.reviews-section{padding:7rem 0;background:var(--near-black);}
.reviews-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1.5rem;margin-bottom:3rem;}
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;}
.review-card{background:rgba(255,255,255,0.03);border:1px solid var(--border-dark);padding:1.75rem;transition:background 0.2s;}
.review-card:hover{background:rgba(255,255,255,0.06);}
.review-top{display:flex;align-items:center;gap:0.9rem;margin-bottom:1.1rem;}
.r-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.r-avatar img{width:100%;height:100%;object-fit:cover;}
.r-avatar-fallback{width:42px;height:42px;border-radius:50%;background:var(--olive);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--cream);flex-shrink:0;}
.r-name{font-weight:700;font-size:0.95rem;color:var(--cream);}
.r-date{font-family:'Courier Prime',monospace;font-size:0.6rem;color:var(--text-muted);margin-top:2px;}
.stars{color:var(--orange-bright);font-size:0.9rem;letter-spacing:2px;margin-bottom:0.75rem;}
.r-text{font-size:0.92rem;color:rgba(240,234,216,0.72);line-height:1.75;font-style:italic;}
.verified{display:inline-flex;align-items:center;gap:4px;font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.1em;color:var(--lime-accent);margin-top:0.85rem;}

/* ── DONATE ── */
.donate-section{position:relative;overflow:hidden;}
.donate-bg{height:100%;position:absolute;inset:0;background-size:cover;background-position:center;background-attachment:fixed;}
.donate-bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.78);}
.donate-inner{position:relative;z-index:2;padding:7rem 2rem;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;}
@media(max-width:768px){.donate-inner{grid-template-columns:1fr;gap:2.5rem;padding:5rem 1.5rem;}}
.impact-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:2rem 0;}
.impact-item{padding:1.25rem;background:rgba(255,255,255,0.05);border:1px solid var(--border-dark);}
.impact-amt{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--lime-accent);}
.impact-desc{font-size:0.82rem;color:var(--text-muted);margin-top:0.2rem;line-height:1.5;}
.progress-track{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin:1rem 0;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--lime-accent));border-radius:3px;}
.donate-form-box{background:rgba(10,12,10,0.85);border:1px solid var(--border-dark);padding:2rem;border-radius:2px;}
.donate-form-box h3{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--cream);margin-bottom:1.5rem;}
.amount-grid{display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.75rem 0 1rem;}
.amt-btn{font-family:'Courier Prime',monospace;font-size:0.82rem;font-weight:700;padding:0.6rem 1.1rem;border:1px solid var(--border-light);background:transparent;color:var(--cream);cursor:pointer;border-radius:2px;transition:all 0.2s;}
.amt-btn:hover,.amt-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;}

/* ── CONTACT ── */
.contact-section{padding:7rem 0;background:var(--mud);}
.contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:5rem;align-items:start;}
@media(max-width:768px){.contact-grid{grid-template-columns:1fr;gap:2.5rem;}}
.contact-info-item{display:flex;gap:1rem;align-items:flex-start;padding:1rem 0;border-bottom:1px solid var(--border-dark);}
.ci-icon{width:36px;height:36px;background:rgba(168,200,72,0.12);border:1px solid rgba(168,200,72,0.2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.ci-label{font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--lime-accent);margin-bottom:0.15rem;}
.ci-val{font-size:0.92rem;color:var(--text-on-dark);}
.contact-form-box{background:rgba(255,255,255,0.04);border:1px solid var(--border-dark);padding:2rem;border-radius:2px;}
.contact-form-box h3{font-family:'Bebas Neue',sans-serif;font-size:2rem;margin-bottom:1.25rem;}

/* ── FOOTER ── */
footer{background:var(--black);border-top:1px solid var(--border-dark);padding:4rem 2rem 2rem;}
.footer-grid{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:3rem;max-width:1200px;margin:0 auto;padding-bottom:3rem;border-bottom:1px solid var(--border-dark);}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:500px){.footer-grid{grid-template-columns:1fr;}}
.f-logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);margin-bottom:0.5rem;}
.f-tagline{font-size:0.88rem;color:var(--text-muted);line-height:1.7;max-width:280px;}
.f-head{font-family:'Courier Prime',monospace;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--lime-accent);margin-bottom:1rem;}
.f-links{list-style:none;}
.f-links li{margin-bottom:0.5rem;}
.f-links a{font-size:0.88rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
.f-links a:hover{color:var(--lime-accent);}
.footer-bottom{max-width:1200px;margin:1.5rem auto 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;}
.f-copy{font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.08em;color:var(--text-muted);}

/* ── ADMIN ── */
.admin-wrap{min-height:100vh;background:var(--near-black);padding:2rem;}
.admin-top{max-width:960px;margin:0 auto 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border-dark);}
.admin-logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--cream);}
.admin-tabs{display:flex;gap:0;max-width:960px;margin:0 auto 2rem;border-bottom:1px solid var(--border-dark);}
.a-tab{padding:0.65rem 1.4rem;font-family:'Courier Prime',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;background:none;border:none;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;}
.a-tab:hover{color:var(--cream);}
.a-tab.on{color:var(--lime-accent);border-bottom-color:var(--lime-accent);}
.a-card{max-width:960px;margin:0 auto 1.5rem;background:rgba(255,255,255,0.03);border:1px solid var(--border-dark);border-radius:2px;padding:1.75rem;}
.a-card-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--cream);margin-bottom:1.25rem;}
.a-row{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;border-bottom:1px solid var(--border-dark);gap:1rem;flex-wrap:wrap;}
.a-row:last-child{border-bottom:none;padding-bottom:0;}
.a-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;max-width:960px;margin:0 auto 2rem;}
@media(max-width:600px){.a-stat-grid{grid-template-columns:repeat(2,1fr);}}
.a-stat{background:rgba(255,255,255,0.04);border:1px solid var(--border-dark);border-radius:2px;padding:1.1rem;text-align:center;}
.a-stat-num{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--lime-accent);}
.a-stat-label{font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-top:0.2rem;}
.badge-pub{display:inline-block;font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.2rem 0.6rem;background:rgba(90,112,72,0.25);border:1px solid rgba(90,112,72,0.4);color:#8ac860;border-radius:2px;}
.badge-draft{display:inline-block;font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.2rem 0.6rem;background:rgba(212,98,26,0.2);border:1px solid rgba(212,98,26,0.35);color:#f07020;border-radius:2px;}
.form-panel{background:rgba(168,200,72,0.05);border:1px solid rgba(168,200,72,0.15);border-radius:2px;padding:1.5rem;margin-bottom:1.5rem;}
.form-panel h4{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--cream);margin-bottom:1rem;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem;}
@media(max-width:500px){.grid-2{grid-template-columns:1fr;}}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.fu{animation:fadeUp 0.7s ease forwards;}
.fu-2{animation:fadeUp 0.7s 0.15s ease both;}
.fu-3{animation:fadeUp 0.7s 0.3s ease both;}
.fu-4{animation:fadeUp 0.7s 0.45s ease both;}

// ── Stars ──
function Stars({n,onSet}){
  const [hov,setHov]=useState(0);
  return(
    <div style={{display:'flex',gap:'3px',margin:'0.5rem 0'}}>
      {[1,2,3,4,5].map(s=>(
        <span key={s} style={{fontSize:'1.2rem',cursor:onSet?'pointer':'default',color:s<=(hov||n)?'#f07020':'rgba(240,234,216,0.2)',transition:'color 0.15s'}}
          onMouseEnter={()=>onSet&&setHov(s)} onMouseLeave={()=>onSet&&setHov(0)} onClick={()=>onSet&&onSet(s)}>★</span>
      ))}
    </div>
  );
}

// ── Sign-In Modal ──
function SignInModal({onClose,onSuccess,purpose}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [mode,setMode]=useState('in');
  const [err,setErr]=useState('');
  function go(e){
    e.preventDefault();
    if(purpose==='admin'){
      email===ADMIN_CREDS.username&&pass===ADMIN_CREDS.password?onSuccess({role:'admin',name:'Admin'}):setErr('Invalid credentials.');
    } else {
      email&&pass.length>=6?onSuccess({role:'user',name:email.split('@')[0]}):setErr('Valid email + 6-char password required.');
    }
  }
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-x" onClick={onClose}>✕</button>
        <div className="label" style={{marginBottom:'0.3rem'}}>{purpose==='admin'?'Admin Access':'Member Account'}</div>
        <h2>{mode==='in'?'Sign In':'Create Account'}</h2>
        {err&&<div className="form-error">{err}</div>}
        <form onSubmit={go}>
          <label>{purpose==='admin'?'Username':'Email'}</label>
          <input value={email} onChange={e=>setEmail(e.target.value)} placeholder={purpose==='admin'?'admin':'you@email.com'} required/>
          <label>Password</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" required/>
          {mode==='up'&&<><label>Confirm Password</label><input type="password" placeholder="••••••••"/></>}
          <button type="submit" className="btn btn-orange btn-full" style={{marginTop:'1.5rem'}}>
            {mode==='in'?'Sign In':'Create Account'}
          </button>
        </form>
        {purpose!=='admin'&&(
          <p style={{textAlign:'center',marginTop:'1.1rem',fontSize:'0.85rem',color:'rgba(240,234,216,0.5)'}}>
            {mode==='in'?<>New? <button style={{background:'none',border:'none',color:'var(--lime-accent)',cursor:'pointer',fontFamily:'Cabin,sans-serif',fontSize:'0.85rem',textDecoration:'underline'}} onClick={()=>{setErr('');setMode('up');}}>Create account</button></>:<>Have one? <button style={{background:'none',border:'none',color:'var(--lime-accent)',cursor:'pointer',fontFamily:'Cabin,sans-serif',fontSize:'0.85rem',textDecoration:'underline'}} onClick={()=>{setErr('');setMode('in');}}>Sign in</button></>}
          </p>
        )}
        {purpose==='admin'&&<p style={{textAlign:'center',marginTop:'0.75rem',fontSize:'0.65rem',fontFamily:'Courier Prime,monospace',color:'rgba(240,234,216,0.3)',letterSpacing:'0.08em'}}>ADMIN ACCESS ONLY</p>}
      </div>
    </div>
  );
}

// ── Review Modal ──
function ReviewModal({onClose,user,onSubmit}){
  const [rating,setRating]=useState(5);
  const [text,setText]=useState('');
  function go(e){
    e.preventDefault();
    if(text.trim().length<20)return;
    onSubmit({rating,text:text.trim()});onClose();
  }
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <button className="modal-x" onClick={onClose}>✕</button>
        <div className="label" style={{marginBottom:'0.3rem'}}>Verified Review</div>
        <h2>Leave Feedback</h2>
        <p style={{fontSize:'0.85rem',color:'var(--lime-accent)',marginBottom:'1.25rem'}}>Signed in as <strong>{user?.name}</strong> — review will be marked verified ✓</p>
        <form onSubmit={go}>
          <label>Your Rating</label>
          <Stars n={rating} onSet={setRating}/>
          <label>Your Review</label>
          <textarea value={text} onChange={e=>setText(e.target.value)} rows={5} placeholder="Share your experience with our field guides or programs..." style={{resize:'vertical'}} required/>
          <p style={{fontSize:'0.65rem',fontFamily:'Courier Prime,monospace',color:'rgba(240,234,216,0.35)',marginTop:'0.3rem'}}>{text.length} chars · minimum 20</p>
          <button type="submit" className="btn btn-orange btn-full" style={{marginTop:'1.25rem'}} disabled={text.trim().length<20}>Submit Verified Review</button>
        </form>
      </div>
    </div>
  );
}

// ── Donate Modal ──
function DonateModal({onClose,amount,onToast}){
  const [name,setName]=useState('');

    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>

        <button className="modal-x" onClick={onClose}>✕</button>

        <h2>Donate ${amount}</h2>
        <form onSubmit={go}>
          <label>Full Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" required/>

            <div key={n.id} className="a-row">
              <div style={{flex:1,minWidth:'180px'}}>

                <div style={{fontWeight:'700',color:'var(--cream)',fontSize:'0.92rem',marginTop:'0.2rem'}}>{n.title}</div>

      {tab==='settings'&&(
        <div className="a-card">
          <div className="a-card-title">Site Settings</div>
          <label>Tagline</label><input defaultValue="Field Guides by a Herpetologist, for the Field."/>

          <button className="btn btn-lime btn-sm" style={{marginTop:'1.25rem'}}>Save Settings</button>
        </div>
      )}
    </div>
  );
}

        </div>
      </section>

      {/* FOOTER */}
      <footer>
        <div className="footer-grid">
          <div>
            <div className="f-logo">Besharse Field Guides</div>
            <p className="f-tagline">Field guides built in the field — by a herpetologist, for the field. Proudly based in northeast Arkansas since 2019.</p>
          </div>
          <div>
            <div className="f-head">Field Guides</div>
            <ul className="f-links">
              {books.filter(b=>b.status==='published').map(b=>(<li key={b.id}><a href="#books" onClick={e=>{e.preventDefault();go('books');}}>{b.vol}: {b.title.split(' ').slice(0,3).join(' ')}</a></li>))}
            </ul>
          </div>
          <div>
            <div className="f-head">Site</div>
            <ul className="f-links">
              {navItems.map(n=>(<li key={n.id}><a href={'#'+n.id} onClick={e=>{e.preventDefault();go(n.id);}}>{n.l}</a></li>))}
            </ul>
          </div>
          <div>
            <div className="f-head">Connect</div>
            <ul className="f-links">
              <li><a href="#">@BesharseFieldGuides</a></li>
              <li><a href="#">Facebook</a></li>
              <li><a href="#">YouTube</a></li>
              <li><a href="#" onClick={e=>{e.preventDefault();setShowAdminLogin(true);}}>Admin Login</a></li>
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span className="f-copy">© 2026 Besharse Field Guides · All Rights Reserved</span>
          <span className="f-copy" style={{color:'var(--lime-accent)'}}>BesharseFieldGuides.com</span>
        </div>
      </footer>

      {/* MODALS */}
      {showSignIn&&<SignInModal purpose="user" onClose={()=>setShowSignIn(false)} onSuccess={u=>{onSignIn(u);setShowSignIn(false);onToast(`Welcome, ${u.name}!`);}}/>}
      {showAdminLogin&&<SignInModal purpose="admin" onClose={()=>setShowAdminLogin(false)} onSuccess={u=>{onAdminLogin(u);setShowAdminLogin(false);}}/>}
      {showReview&&user&&<ReviewModal user={user} onClose={()=>setShowReview(false)} onSubmit={(r)=>{onNewReview(r,user);onToast('Review submitted — thank you!');}}/>}
      {showDonate&&<DonateModal amount={donateAmt} onClose={()=>setShowDonate(false)} onToast={onToast}/>}
      {openNews&&<NewsModal article={openNews} onClose={()=>setOpenNews(null)}/>}
    </div>
  );
}

// ── APP ──
function App(){
  const [user,setUser]=useState(null);
  const [isAdmin,setIsAdmin]=useState(false);
  const [books,setBooks]=useState(INIT_BOOKS);
  const [news,setNews]=useState(INIT_NEWS);
  const [reviews,setReviews]=useState(INIT_REVIEWS);
  const [toast,setToast]=useState({msg:'',show:false});
  const timer=useRef(null);

  function showToast(msg){
    clearTimeout(timer.current);
    setToast({msg,show:true});
    timer.current=setTimeout(()=>setToast(p=>({...p,show:false})),3500);
  }
  function handleNewReview(r,u){
    setReviews(p=>[{id:Date.now(),author:u.name,rating:r.rating,text:r.text,date:'Just now',avatarIdx:null},...p]);
  }
  function handleAdminLogin(u){setUser(u);setIsAdmin(true);showToast('Welcome to Admin Dashboard!');}

  if(isAdmin)return<><AdminPanel onLogout={()=>setIsAdmin(false)} books={books} setBooks={setBooks} news={news} setNews={setNews} onToast={showToast}/><Toast msg={toast.msg} show={toast.show}/></>;

  return<><Site user={user} onSignIn={setUser} onAdminLogin={handleAdminLogin} books={books} news={news} reviews={reviews} onNewReview={handleNewReview} onToast={showToast}/><Toast msg={toast.msg} show={toast.show}/></>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
