<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Besharse Field Guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --forest:#1a3a2a;
    --deep-green:#2d5a3d;
    --moss:#4a7c5f;
    --sage:#7aaa8a;
    --cream:#f5f0e8;
    --parchment:#ede5d4;
    --warm-white:#faf7f2;
    --bark:#6b4c2a;
    --amber:#c8832a;
    --gold:#d4a843;
    --text-dark:#1c1c1c;
    --text-med:#3a3a3a;
    --text-light:#6b6b6b;
    --border:#d4c9b0;
    --shadow:rgba(26,58,42,0.12);
  }
  html{scroll-behavior:smooth;}
  body{
    font-family:'Source Serif 4',serif;
    background:var(--warm-white);
    color:var(--text-dark);
    overflow-x:hidden;
  }
  #root{min-height:100vh;}

  /* Scrollbar */
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:var(--parchment);}
  ::-webkit-scrollbar-thumb{background:var(--moss);border-radius:3px;}

  /* Toast */
  .toast{
    position:fixed;bottom:2rem;right:2rem;
    background:var(--forest);color:var(--cream);
    padding:0.75rem 1.5rem;border-radius:6px;
    font-family:'DM Mono',monospace;font-size:0.8rem;
    z-index:9999;opacity:0;transition:opacity 0.3s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* Modal overlay */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(26,58,42,0.6);
    backdrop-filter:blur(4px);
    z-index:1000;
    display:flex;align-items:center;justify-content:center;
    padding:1rem;
  }
  .modal-box{
    background:var(--warm-white);
    border:1px solid var(--border);
    border-radius:4px;
    max-width:480px;width:100%;
    max-height:90vh;overflow-y:auto;
    padding:2.5rem;
    position:relative;
  }
  .modal-close{
    position:absolute;top:1rem;right:1rem;
    background:none;border:none;
    font-size:1.4rem;cursor:pointer;
    color:var(--text-light);
    font-family:'DM Mono',monospace;
  }
  .modal-close:hover{color:var(--forest);}

  /* Forms */
  input,textarea,select{
    width:100%;
    padding:0.65rem 0.9rem;
    border:1px solid var(--border);
    border-radius:3px;
    font-family:'Source Serif 4',serif;
    font-size:0.95rem;
    background:var(--warm-white);
    color:var(--text-dark);
    outline:none;
    transition:border-color 0.2s;
    margin-top:0.35rem;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--moss);}
  label{
    display:block;
    font-size:0.8rem;
    font-family:'DM Mono',monospace;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-light);
    margin-top:1rem;
  }
  label:first-child{margin-top:0;}

  /* Buttons */
  .btn{
    display:inline-block;
    padding:0.7rem 1.8rem;
    border-radius:3px;
    font-family:'DM Mono',monospace;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    border:1px solid transparent;
    transition:all 0.2s;
    text-decoration:none;
  }
  .btn-primary{
    background:var(--forest);
    color:var(--cream);
    border-color:var(--forest);
  }
  .btn-primary:hover{background:var(--deep-green);}
  .btn-outline{
    background:transparent;
    color:var(--forest);
    border-color:var(--forest);
  }
  .btn-outline:hover{background:var(--forest);color:var(--cream);}
  .btn-amber{
    background:var(--amber);
    color:#fff;
    border-color:var(--amber);
  }
  .btn-amber:hover{background:#b07020;}
  .btn-sm{padding:0.5rem 1.2rem;font-size:0.72rem;}
  .btn-full{width:100%;text-align:center;}

  /* Star rating */
  .stars{color:var(--gold);font-size:1rem;}
  .star-empty{color:var(--border);}

  /* Section spacing */
  .section{padding:5rem 1.5rem;}
  .section-alt{background:var(--parchment);}
  .container{max-width:1100px;margin:0 auto;}
  .section-label{
    font-family:'DM Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--moss);
    margin-bottom:0.75rem;
  }
  .section-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(1.8rem,4vw,3rem);
    font-weight:700;
    color:var(--forest);
    line-height:1.2;
    margin-bottom:1.5rem;
  }
  .divider{
    width:60px;height:2px;
    background:var(--gold);
    margin:1.5rem 0;
  }

  /* Nav */
  nav{
    position:fixed;top:0;left:0;right:0;
    z-index:500;
    background:rgba(250,247,242,0.95);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:0 1.5rem;
    height:64px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav-logo{
    font-family:'Playfair Display',serif;
    font-size:1.15rem;
    font-weight:700;
    color:var(--forest);
    text-decoration:none;
    line-height:1.2;
  }
  .nav-logo span{
    display:block;
    font-family:'DM Mono',monospace;
    font-size:0.55rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--moss);
    font-weight:400;
  }
  .nav-links{
    display:flex;align-items:center;gap:2rem;
    list-style:none;
  }
  .nav-links a{
    font-family:'DM Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-med);
    text-decoration:none;
    transition:color 0.2s;
  }
  .nav-links a:hover{color:var(--forest);}
  .nav-actions{display:flex;align-items:center;gap:0.75rem;}

  /* Hero */
  .hero{
    min-height:100vh;
    background:var(--forest);
    display:flex;align-items:center;
    position:relative;
    overflow:hidden;
    padding:6rem 1.5rem 4rem;
  }
  .hero-bg{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 80% 50%, rgba(74,124,95,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(26,58,42,0.8) 0%, transparent 50%);
  }
  .hero-pattern{
    position:absolute;inset:0;
    opacity:0.04;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.5) 39px, rgba(255,255,255,0.5) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.5) 39px, rgba(255,255,255,0.5) 40px);
  }
  .hero-content{position:relative;z-index:2;max-width:680px;}
  .hero-eyebrow{
    font-family:'DM Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:1.25rem;
  }
  .hero-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(2.8rem,6vw,5rem);
    font-weight:700;
    color:var(--cream);
    line-height:1.1;
    margin-bottom:1.5rem;
  }
  .hero-title em{
    color:var(--gold);
    font-style:italic;
  }
  .hero-sub{
    font-size:1.1rem;
    color:rgba(245,240,232,0.75);
    line-height:1.7;
    max-width:520px;
    margin-bottom:2.5rem;
  }
  .hero-ctas{display:flex;gap:1rem;flex-wrap:wrap;}
  .hero-scroll{
    position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:0.5rem;
    font-family:'DM Mono',monospace;font-size:0.65rem;
    letter-spacing:0.15em;text-transform:uppercase;
    color:var(--sage);
    animation:bounce 2s ease-in-out infinite;
  }
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}

  /* Books grid */
  .books-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:2rem;
    margin-top:3rem;
  }
  .book-card{
    background:var(--warm-white);
    border:1px solid var(--border);
    border-radius:4px;
    overflow:hidden;
    transition:transform 0.2s, box-shadow 0.2s;
  }
  .book-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 40px var(--shadow);
  }
  .book-cover{
    height:220px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;
    font-size:1.1rem;
    color:var(--cream);
    text-align:center;
    padding:1.5rem;
    position:relative;
    overflow:hidden;
  }
  .book-cover-inner{position:relative;z-index:2;}
  .book-cover-vol{
    font-family:'DM Mono',monospace;
    font-size:0.65rem;letter-spacing:0.15em;
    text-transform:uppercase;
    opacity:0.75;margin-bottom:0.5rem;
  }
  .book-cover-title{font-weight:700;line-height:1.3;font-size:1.2rem;}
  .book-cover-sub{font-size:0.85rem;font-style:italic;opacity:0.8;margin-top:0.4rem;}
  .book-info{padding:1.25rem;}
  .book-meta{
    font-family:'DM Mono',monospace;
    font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--moss);margin-bottom:0.5rem;
  }
  .book-title{
    font-family:'Playfair Display',serif;
    font-size:1.1rem;font-weight:600;
    color:var(--forest);margin-bottom:0.5rem;
  }
  .book-desc{font-size:0.88rem;color:var(--text-light);line-height:1.6;margin-bottom:1rem;}
  .book-price{
    font-family:'DM Mono',monospace;
    font-size:1rem;font-weight:500;
    color:var(--bark);margin-bottom:1rem;
  }
  .book-buy-links{display:flex;gap:0.5rem;flex-wrap:wrap;}
  .buy-link{
    display:inline-block;
    padding:0.4rem 0.9rem;
    border:1px solid var(--border);
    border-radius:3px;
    font-family:'DM Mono',monospace;
    font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--text-med);text-decoration:none;
    transition:all 0.2s;
  }
  .buy-link:hover{background:var(--forest);color:var(--cream);border-color:var(--forest);}

  /* News */
  .news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1.75rem;
    margin-top:2.5rem;
  }
  .news-card{
    background:var(--warm-white);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1.5rem;
    transition:box-shadow 0.2s;
  }
  .news-card:hover{box-shadow:0 8px 30px var(--shadow);}
  .news-tag{
    display:inline-block;
    padding:0.25rem 0.7rem;
    background:var(--parchment);
    border-radius:2px;
    font-family:'DM Mono',monospace;
    font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--moss);margin-bottom:0.75rem;
  }
  .news-title{
    font-family:'Playfair Display',serif;
    font-size:1.1rem;font-weight:600;
    color:var(--forest);line-height:1.3;margin-bottom:0.6rem;
  }
  .news-excerpt{font-size:0.88rem;color:var(--text-light);line-height:1.6;margin-bottom:1rem;}
  .news-date{
    font-family:'DM Mono',monospace;
    font-size:0.65rem;color:var(--text-light);
    letter-spacing:0.08em;
  }

  /* About */
  .about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5rem;
    align-items:start;
  }
  @media(max-width:768px){.about-grid{grid-template-columns:1fr;gap:2.5rem;}}
  .about-portrait{
    width:100%;
    aspect-ratio:3/4;
    background:var(--deep-green);
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    color:var(--sage);
    font-family:'DM Mono',monospace;
    font-size:0.75rem;letter-spacing:0.1em;
    position:relative;overflow:hidden;
  }
  .portrait-pattern{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(122,170,138,0.08) 20px, rgba(122,170,138,0.08) 21px),
      repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(122,170,138,0.08) 20px, rgba(122,170,138,0.08) 21px);
  }
  .portrait-icon{
    position:relative;z-index:2;text-align:center;
  }
  .portrait-icon svg{opacity:0.6;margin-bottom:1rem;}
  .credential{
    display:flex;align-items:flex-start;gap:1rem;
    margin-bottom:1.5rem;
    padding-bottom:1.5rem;
    border-bottom:1px solid var(--border);
  }
  .credential:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .cred-icon{
    width:36px;height:36px;flex-shrink:0;
    background:var(--parchment);
    border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
  }
  .cred-label{
    font-family:'DM Mono',monospace;
    font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--moss);margin-bottom:0.2rem;
  }
  .cred-val{font-size:0.95rem;color:var(--text-dark);font-weight:400;}

  /* Reviews */
  .reviews-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:1.5rem;
    margin-top:2.5rem;
  }
  .review-card{
    background:var(--warm-white);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1.5rem;
  }
  .review-header{
    display:flex;align-items:center;gap:0.75rem;
    margin-bottom:1rem;
  }
  .review-avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--moss);
    display:flex;align-items:center;justify-content:center;
    color:var(--cream);
    font-family:'DM Mono',monospace;font-size:0.8rem;font-weight:500;
  }
  .review-name{font-weight:600;font-size:0.95rem;color:var(--forest);}
  .review-date{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--text-light);}
  .review-text{font-size:0.9rem;color:var(--text-med);line-height:1.7;font-style:italic;}
  .verified-badge{
    display:inline-flex;align-items:center;gap:0.3rem;
    font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.06em;
    color:var(--moss);margin-top:0.75rem;
  }

  /* Donate */
  .donate-amounts{
    display:flex;gap:0.75rem;flex-wrap:wrap;margin:1.5rem 0;
  }
  .donate-btn{
    padding:0.7rem 1.4rem;
    border:1px solid var(--border);
    border-radius:3px;
    background:var(--warm-white);
    font-family:'DM Mono',monospace;font-size:0.85rem;font-weight:500;
    color:var(--text-dark);cursor:pointer;transition:all 0.2s;
  }
  .donate-btn:hover,.donate-btn.active{
    background:var(--forest);color:var(--cream);border-color:var(--forest);
  }
  .donate-impact{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:1.25rem;margin:2rem 0;
  }
  .impact-card{
    background:rgba(74,124,95,0.08);
    border:1px solid rgba(74,124,95,0.2);
    border-radius:4px;padding:1.25rem;
  }
  .impact-amount{
    font-family:'Playfair Display',serif;
    font-size:1.5rem;font-weight:700;color:var(--forest);
  }
  .impact-desc{font-size:0.83rem;color:var(--text-med);margin-top:0.3rem;line-height:1.5;}

  /* Contact */
  .contact-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;
  }
  @media(max-width:768px){.contact-grid{grid-template-columns:1fr;gap:2.5rem;}}
  .contact-item{
    display:flex;align-items:flex-start;gap:1rem;
    margin-bottom:1.5rem;
  }
  .contact-icon{
    width:40px;height:40px;flex-shrink:0;
    background:var(--parchment);border-radius:3px;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  }
  .contact-label{
    font-family:'DM Mono',monospace;font-size:0.65rem;
    letter-spacing:0.1em;text-transform:uppercase;color:var(--moss);
    margin-bottom:0.2rem;
  }
  .contact-val{font-size:0.95rem;color:var(--text-dark);}

  /* Footer */
  footer{
    background:var(--forest);
    color:rgba(245,240,232,0.7);
    padding:3.5rem 1.5rem;
  }
  .footer-inner{
    max-width:1100px;margin:0 auto;
    display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:3rem;
  }
  @media(max-width:768px){.footer-inner{grid-template-columns:1fr;gap:2rem;}}
  .footer-brand{
    font-family:'Playfair Display',serif;
    font-size:1.2rem;font-weight:700;color:var(--cream);
    margin-bottom:0.75rem;
  }
  .footer-tagline{font-size:0.88rem;line-height:1.7;}
  .footer-heading{
    font-family:'DM Mono',monospace;font-size:0.65rem;
    letter-spacing:0.15em;text-transform:uppercase;
    color:var(--sage);margin-bottom:1rem;
  }
  .footer-links{list-style:none;}
  .footer-links li{margin-bottom:0.5rem;}
  .footer-links a{
    font-size:0.88rem;color:rgba(245,240,232,0.65);text-decoration:none;
    transition:color 0.2s;
  }
  .footer-links a:hover{color:var(--gold);}
  .footer-bottom{
    max-width:1100px;margin:2.5rem auto 0;
    border-top:1px solid rgba(245,240,232,0.12);
    padding-top:1.5rem;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem;
  }
  .footer-copy{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.08em;}

  /* Admin panel */
  .admin-panel{
    min-height:100vh;
    background:var(--parchment);
    padding:2rem 1.5rem;
  }
  .admin-header{
    max-width:900px;margin:0 auto 2rem;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:1rem;
  }
  .admin-title{
    font-family:'Playfair Display',serif;
    font-size:1.8rem;font-weight:700;color:var(--forest);
  }
  .admin-sub{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;color:var(--text-light);}
  .admin-tabs{
    display:flex;gap:0.5rem;max-width:900px;margin:0 auto 2rem;
    border-bottom:1px solid var(--border);
  }
  .admin-tab{
    padding:0.6rem 1.2rem;
    font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;
    background:none;border:none;cursor:pointer;
    color:var(--text-light);transition:color 0.2s;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .admin-tab.active{color:var(--forest);border-bottom-color:var(--forest);}
  .admin-card{
    max-width:900px;margin:0 auto 1.5rem;
    background:var(--warm-white);border:1px solid var(--border);
    border-radius:4px;padding:1.75rem;
  }
  .admin-card-title{
    font-family:'Playfair Display',serif;
    font-size:1.1rem;font-weight:600;color:var(--forest);
    margin-bottom:1.25rem;
  }
  .book-admin-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 0;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap;
  }
  .book-admin-row:last-child{border-bottom:none;padding-bottom:0;}
  .news-admin-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:0.85rem 0;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap;
  }
  .news-admin-row:last-child{border-bottom:none;padding-bottom:0;}
  .status-badge{
    display:inline-block;padding:0.2rem 0.65rem;border-radius:2px;
    font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;
  }
  .status-published{background:#e8f5e9;color:#2e7d32;}
  .status-draft{background:#fff8e1;color:#f57f17;}

  /* Responsive nav */
  @media(max-width:768px){
    .nav-links{display:none;}
    .nav-actions .btn{display:none;}
    .nav-actions .btn:last-child{display:inline-block;}
  }

  /* Animations */
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  .fade-up{animation:fadeUp 0.6s ease forwards;}

  /* Progress bar for donate */

// ─── SIGN IN MODAL ────────────────────────────────────────────
function SignInModal({onClose, onSuccess, purpose}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [mode,setMode]=useState('signin'); // signin | signup

  function handleSubmit(e){
    e.preventDefault();
    if(purpose==='admin'){
      if(email===ADMIN_CREDS.username && pass===ADMIN_CREDS.password){
        onSuccess({role:'admin',name:'Admin'});
      } else {
        setErr('Invalid admin credentials.');
      }
    } else {
      if(email && pass.length>=6){
        onSuccess({role:'user',name:email.split('@')[0]});
      } else {
        setErr('Please enter a valid email and a password (6+ chars).');
      }
    }
  }

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div style={{marginBottom:'1.5rem'}}>
          <div className="section-label">{purpose==='admin'?'Admin Access':'Member Account'}</div>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.6rem',color:'var(--forest)'}}>
            {mode==='signup'?'Create Account':'Sign In'}
          </h2>
        </div>
        {err && <div style={{background:'#fff3cd',border:'1px solid #ffc107',borderRadius:'3px',padding:'0.65rem 0.9rem',fontSize:'0.85rem',marginBottom:'1rem',color:'#856404'}}>{err}</div>}
        <form onSubmit={handleSubmit}>
          <label>{purpose==='admin'?'Username':'Email Address'}</label>
          <input type={purpose==='admin'?'text':'email'} value={email} onChange={e=>setEmail(e.target.value)} placeholder={purpose==='admin'?'admin':'you@email.com'} required/>
          <label>Password</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" required/>
          {mode==='signup' && <>
            <label>Confirm Password</label>
            <input type="password" placeholder="••••••••"/>

          <button type="submit" className="btn btn-primary btn-full" style={{marginTop:'1.5rem'}}>
            {mode==='signup'?'Create Account':'Sign In'}
          </button>

function FeedbackModal({onClose, user, onSubmit}){
  const [rating,setRating]=useState(5);

    e.preventDefault();
    if(text.trim().length<20){return;}
    onSubmit({rating,text:text.trim()});
    onClose();
  }
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>

          <p style={{fontSize:'0.85rem',color:'var(--moss)',marginTop:'0.4rem'}}>Signed in as <strong>{user?.name}</strong> — your review will be marked verified ✓</p>

        <form onSubmit={handleSubmit}>
          <label>Your Rating</label>
          <StarRating value={rating} onChange={setRating}/>
          <label>Your Review</label>
          <textarea value={text} onChange={e=>setText(e.target.value)} rows={5} placeholder="Share your experience with our field guides or educational programs..." style={{resize:'vertical'}} required/>
          <p style={{fontSize:'0.72rem',fontFamily:"'DM Mono',monospace",color:'var(--text-light)',marginTop:'0.35rem'}}>Minimum 20 characters · {text.length} typed</p>

            Submit Verified Review
          </button>
        </form>
      </div>
    </div>
  );
}

function AdminPanel({onLogout, books, setBooks, news, setNews, onToast}){
  const [tab,setTab]=useState('books');
  const [showAddBook,setShowAddBook]=useState(false);
  const [showAddNews,setShowAddNews]=useState(false);
  const [newBook,setNewBook]=useState({vol:'',title:'',subtitle:'',desc:'',price:'',pages:'',year:new Date().getFullYear(),links:[{label:'Amazon',url:''},{label:'Direct',url:'#'}],coverColor:'#1a3a2a',coverAccent:'#4a7c5f'});
  const [newNews,setNewNews]=useState({tag:'',title:'',excerpt:'',full:'',date:new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})});

  function publishBook(){
    if(!newBook.title||!newBook.vol) return;
    const b={...newBook,id:Date.now(),status:'published',pages:parseInt(newBook.pages)||200,year:parseInt(newBook.year)||2024};
    setBooks(prev=>[...prev,b]);
    setNewBook({vol:'',title:'',subtitle:'',desc:'',price:'',pages:'',year:new Date().getFullYear(),links:[{label:'Amazon',url:''},{label:'Direct',url:'#'}],coverColor:'#1a3a2a',coverAccent:'#4a7c5f'});
    setShowAddBook(false);
    onToast('Book published successfully!');
  }

  function toggleBookStatus(id){
    setBooks(prev=>prev.map(b=>b.id===id?{...b,status:b.status==='published'?'draft':'published'}:b));
  }
  function deleteBook(id){
    if(window.confirm('Delete this book?')) setBooks(prev=>prev.filter(b=>b.id!==id));
  }
  function publishNews(){
    if(!newNews.title||!newNews.tag) return;
    const n={...newNews,id:Date.now(),status:'published'};
    setNews(prev=>[...prev,n]);
    setNewNews({tag:'',title:'',excerpt:'',full:'',date:new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})});
    setShowAddNews(false);
    onToast('News article published!');
  }
  function toggleNewsStatus(id){
    setNews(prev=>prev.map(n=>n.id===id?{...n,status:n.status==='published'?'draft':'published'}:n));
  }
  function deleteNews(id){
    if(window.confirm('Delete this article?')) setNews(prev=>prev.filter(n=>n.id!==id));
  }

  return (
    <div className="admin-panel">
      <div className="admin-header">
        <div>
          <div className="admin-title">Admin Dashboard</div>
          <div className="admin-sub">Besharse Field Guides · bfg-admin</div>
        </div>

          <a href="#home" className="btn btn-outline btn-sm" onClick={onLogout} style={{color:'var(--bark)',borderColor:'var(--bark)'}}>← View Site</a>
          <button className="btn btn-outline btn-sm" onClick={onLogout}>Sign Out</button>
        </div>
      </div>

          {label:'Published Books', val:books.filter(b=>b.status==='published').length},
          {label:'Draft Books', val:books.filter(b=>b.status==='draft').length},
          {label:'News Articles', val:news.filter(n=>n.status==='published').length},
          {label:'Total Reviews', val:'Live'},
        ].map((s,i)=>(
          <div key={i} style={{background:'var(--warm-white)',border:'1px solid var(--border)',borderRadius:'4px',padding:'1rem',textAlign:'center'}}>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:'2rem',fontWeight:'700',color:'var(--forest)'}}>{s.val}</div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:'0.65rem',letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-light)',marginTop:'0.25rem'}}>{s.label}</div>
          </div>
        ))}

      <div className="admin-tabs">

          <button key={t} className={'admin-tab'+(tab===t?' active':'')} onClick={()=>setTab(t)}>
            {t.charAt(0).toUpperCase()+t.slice(1)}

        <div className="admin-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
            <div className="admin-card-title">Field Guide Books</div>

                </button>

      {/* NEWS TAB */}

              <input value={newNews.title} onChange={e=>setNewNews(p=>({...p,title:e.target.value}))}/>

              <textarea rows={2} value={newNews.excerpt} onChange={e=>setNewNews(p=>({...p,excerpt:e.target.value}))} style={{resize:'vertical'}}/>
              <label>Full Article Text</label>
              <textarea rows={6} value={newNews.full} onChange={e=>setNewNews(p=>({...p,full:e.target.value}))} style={{resize:'vertical'}}/>
              <button className="btn btn-primary btn-sm" onClick={publishNews} style={{marginTop:'1rem'}}>Publish Article</button>
            </div>
          )}

          {news.map(n=>(
            <div key={n.id} className="news-admin-row">
              <div style={{flex:1,minWidth:'200px'}}>
                <span className="news-tag" style={{marginBottom:'0.25rem'}}>{n.tag}</span>
                <div style={{fontWeight:'600',color:'var(--text-dark)',fontSize:'0.92rem'}}>{n.title}</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:'0.62rem',color:'var(--text-light)'}}>{n.date}</div>

                <span className={'status-badge '+(n.status==='published'?'status-published':'status-draft')}>{n.status}</span>
                <button className="btn btn-outline btn-sm" onClick={()=>toggleNewsStatus(n.id)}>
                  {n.status==='published'?'Unpublish':'Publish'}
                </button>
                <button className="btn btn-sm" onClick={()=>deleteNews(n.id)} style={{color:'#c62828',border:'1px solid #ffcdd2',background:'#fff'}}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      </>}

      {/* SITE TAB */}
      {tab==='site' && (
        <div className="admin-card">
          <div className="admin-card-title">Site Settings</div>
          <p style={{fontSize:'0.9rem',color:'var(--text-light)',marginBottom:'1.5rem'}}>Manage global site information. Changes are reflected immediately on the public site.</p>
          <label>Site Tagline</label>
          <input defaultValue="Field Guides by a Herpetologist, for the Field."/>
          <label>Contact Email</label>
          <input defaultValue="info@besharseFieldGuides.com"/>

          <label>Fundraising Description</label>
          <textarea defaultValue="Help us build the Besharse Wildlife Rescue & Education Center — a permanent facility to rehabilitate injured wildlife, educate the public, and conserve native species across the mid-South." rows={3}/>
          <button className="btn btn-primary btn-sm" style={{marginTop:'1.25rem'}} onClick={()=>{}}>Save Settings</button>
        </div>
      )}
    </div>
  );
}

            <ul className="footer-links">
              {books.filter(b=>b.status==='published').map(b=>(
                <li key={b.id}><a href="#books" onClick={e=>{e.preventDefault();scrollTo('books');}}>{b.vol}: {b.title.split(' ').slice(0,4).join(' ')}…</a></li>
              ))}
            </ul>
          </div>
          <div>
            <div className="footer-heading">Quick Links</div>
            <ul className="footer-links">
              {navLinks.map(l=>(
                <li key={l.id}><a href={'#'+l.id} onClick={e=>{e.preventDefault();scrollTo(l.id);}}>{l.label}</a></li>
              ))}
              <li><a href="#" onClick={e=>{e.preventDefault();setShowAdminLogin(true);}}>Admin Login</a></li>
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span className="footer-copy">© 2026 Besharse Field Guides · All Rights Reserved</span>
          <span className="footer-copy" style={{color:'var(--gold)'}}>BesharseFieldGuides.com</span>
        </div>
      </footer>

      {/* MODALS */}
      {showSignIn && <SignInModal purpose="user" onClose={()=>setShowSignIn(false)} onSuccess={u=>{onSignIn(u);setShowSignIn(false);onToast(`Welcome, ${u.name}!`);}}/>}
      {showAdminLogin && <SignInModal purpose="admin" onClose={()=>setShowAdminLogin(false)} onSuccess={u=>{onAdminLogin(u);setShowAdminLogin(false);}}/>}
      {showFeedback && user && <FeedbackModal user={user} onClose={()=>setShowFeedback(false)} onSubmit={(r)=>{onNewReview(r,user);onToast('Review submitted — thank you!');}}/>}
      {showDonate && <DonateModal amount={donateAmt} onClose={()=>setShowDonate(false)} onToast={onToast}/>}
      {selectedNews && <NewsModal article={selectedNews} onClose={()=>setSelectedNews(null)}/>}
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────
function App(){
  const [user, setUser] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [books, setBooks] = useState(INITIAL_BOOKS);
  const [news, setNews] = useState(INITIAL_NEWS);
  const [reviews, setReviews] = useState(INITIAL_REVIEWS);
  const [toast, setToast] = useState({msg:'',show:false});
  const toastTimer = useRef(null);

  function showToast(msg){
    clearTimeout(toastTimer.current);
    setToast({msg,show:true});
    toastTimer.current = setTimeout(()=>setToast(p=>({...p,show:false})),3500);
  }

  function handleNewReview(r, user){
    const initials = user.name.slice(0,2).toUpperCase();
    setReviews(prev=>[{
      id:Date.now(),
      author:user.name,
      initials,
      rating:r.rating,
      text:r.text,
      date:'Just now'
    },...prev]);
  }

  function handleAdminLogin(u){
    setUser(u);
    setIsAdmin(true);
    showToast('Welcome to the Admin Dashboard!');
  }

  function handleAdminLogout(){
    setIsAdmin(false);
  }

  if(isAdmin){
    return <>
      <AdminPanel onLogout={handleAdminLogout} books={books} setBooks={setBooks} news={news} setNews={setNews} onToast={showToast}/>
      <Toast msg={toast.msg} show={toast.show}/>
    </>;
  }

  return <>
    <Website
      user={user}
      onSignIn={setUser}
      onAdminLogin={handleAdminLogin}
      books={books}
      news={news}
      reviews={reviews}
      onNewReview={handleNewReview}
      onToast={showToast}
    />
    <Toast msg={toast.msg} show={toast.show}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
